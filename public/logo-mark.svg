<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="The Green Team">
  <!-- The Green Team mark: two overlapping leaves forming a heart. Faithful
       vector of the brand lockup — pale leaf behind, forest leaf in front with
       a soft fold highlight. Light-surface version. -->
  <defs>
    <path id="gt-leaf" d="M46 94 C39 72 27 58 34 40 C41 22 66 17 82 31 C95 43 90 64 72 74 C60 80 51 86 46 94 Z"/>
    <clipPath id="gt-front"><use href="#gt-leaf"/></clipPath>
  </defs>
  <!-- back leaf (mirrored, offset up-left, tip to the right) -->
  <use href="#gt-leaf" transform="translate(8 -10) matrix(-1 0 0 1 100 0)" fill="#e3e6e1"/>
  <!-- front leaf -->
  <use href="#gt-leaf" fill="#2c4a2e"/>
  <!-- fold highlight on the inner half of the front leaf -->
  <path clip-path="url(#gt-front)" d="M0 0 H60 C54 38 51 68 46 94 H0 Z" fill="#37583a"/>
</svg>
